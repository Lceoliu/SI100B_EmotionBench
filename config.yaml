# Defaults for the benchmark. Values edited in the TA console (quota_per_day,
# final_pick_deadline, freeze_leaderboard) are stored in SQLite and override these.
quota_per_day: 4
max_params: 50_000_000
max_weight_mb: 200
eval_timeout_sec: 600
num_classes: 7
submission_format: onnx
allowed_input_sizes: [48, 64, 96, 112, 160, 224]
allowed_input_channels: [1, 3]
freeze_leaderboard: false
# Formal-submission deadline, ISO 8601 with offset, e.g. "2026-12-31T23:59:59+08:00". Empty means none.
final_pick_deadline: ""

# ---------------------------------------------------------------------------
# Semester-specific content. Update these for each offering of the course.
# ---------------------------------------------------------------------------
course:
  name: SI100B
  term: Spring 2026
  project_title: 人脸检测与表情分类项目
  description: 本项目为 SI100B 课程 Project 人脸检测与表情分类的评测平台。学生可以提交模型并查看小组排行榜。
  # Only these domains may register. An empty list accepts any valid email.
  email_domains: [shanghaitech.edu.cn]
  instructors:
    - {name: 李正浩, url: "https://sist.shanghaitech.edu.cn/lzh/main.htm"}
  tas:
    - {name: 刘畅, url: "https://lceoliu.github.io/"}
    - {name: 张境轩}
  links:
    - {label: Blackboard 课程资源, url: "https://elearning.shanghaitech.edu.cn:8443/webapps/blackboard/content/listContentEditable.jsp?content_id=_173911_1&course_id=_5304_1"}

# Lab cards on the home page; `resource` refers to an id under `resources`.
lectures:
  - {title: 环境配置与图像基础, detail: 安装必要环境，理解图像读取、像素、通道和基本数据结构。, resource: lab1}
  - {title: OpenCV 基本操作, detail: 读写图像、缩放、绘制图形，并接触级联分类器做人脸检测。, resource: lab2}
  - {title: 模型训练, detail: 从基础分类网络开始，理解训练循环、损失函数和参数更新。, resource: lab3}
  - {title: 模型推理, detail: 加载训练好的模型，对输入图像执行预测并取回结果。, resource: lab4}
  - {title: 端到端流程, detail: 串联读图、人脸检测、Tensor 转换、推理和可视化输出。, resource: lab5}
  - {title: Matplotlib 可视化, detail: 用图表展示样本、预测结果和训练过程。, resource: lab6}
  - {title: 数据标注的重要性, detail: 分析错误样例，理解标注质量和补充数据对准确率的影响。, resource: lab7}
  - {title: 扩展主题, detail: 摄像头实时读取、YOLO 检测、数据增强等进阶方向。, resource: lab8}

# Downloads served from storage/resources/<filename>. The home page and dataset guide
# look up student-kit, fer2013, project-rules and example-<class> by id.
