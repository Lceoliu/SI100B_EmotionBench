# Defaults for the benchmark. Values edited in the TA console (quota_per_day,
# final_pick_deadline, freeze_leaderboard) are stored in SQLite and override these.
quota_per_day: 4
max_params: 50_000_000
max_weight_mb: 200
eval_timeout_sec: 600
num_classes: 7
submission_format: onnx
allowed_input_sizes: [48, 64, 96, 112, 160, 224]
allowed_input_channels: [1, 3]
# Reserved for a public/private leaderboard split; the worker does not read it yet.
splits: {public: 0.3, private: 0.7}
freeze_leaderboard: false
reveal_private: false
reveal_realworld: false
# ISO 8601 with offset, e.g. "2026-12-31T23:59:59+08:00". Empty means no deadline.
final_pick_deadline: ""
