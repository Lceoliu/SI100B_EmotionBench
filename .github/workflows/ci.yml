name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Validate docker-compose.yml
        env:
          SECRET_KEY: ci
          HOST_BENCH_ROOT: /tmp/emotion-bench
        run: docker compose --profile worker --profile eval config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # package-lock.json pins registry.npmmirror.com for the course server; CI installs from npmjs.
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=registry.npmmirror.com
      - run: npm run build
